document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r.\" class=\"slide\" style=\"display:flex;\">\n  <div style=\"flex:1.15;display:flex;flex-direction:column;justify-content:space-between;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);border-right:2px solid var(--color-divider);\">\n    <div class=\"kicker\">Proposta de parceria<\u002Fdiv>\n    <div>\n      <h1 style=\"font-size:112px;line-height:0.98;margin:0 0 24px;letter-spacing:-0.02em;\">HUB<br>MANAGER<br>TOUR<\u002Fh1>\n      <div style=\"width:96px;height:6px;background:var(--tw-accent);margin-bottom:28px;\"><\u002Fdiv>\n      <div style=\"font-size:var(--type-subtitle);font-weight:600;max-width:820px;\">O seu hub de gerenciamento de turnês.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:var(--type-small);color:color-mix(in srgb, var(--color-text) 65%, transparent);max-width:760px;\">De um protótipo que você já testou a um sistema completo de produção de shows.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:0.85;position:relative;display:flex;align-items:center;justify-content:center;\">\n    <div style=\"width:min(100%,360px);aspect-ratio:9/19.5;border-radius:38px;border:10px solid var(--color-text);background:var(--color-text);box-shadow:0 24px 60px color-mix(in srgb, var(--color-text) 30%, transparent);position:relative;overflow:hidden;\">\n      <div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:46%;height:22px;background:var(--color-text);border-radius:0 0 14px 14px;z-index:2;\"><\u002Fdiv>\n      <image-slot id=\"cover-photo\" shape=\"rect\" fit=\"cover\" src=\"a43df129-0827-4d26-9b94-32595c3f5c94\" placeholder=\"Foto de bastidor / produção de turnê\" style=\"width:100%;height:100%;\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"O problema real\" data-speaker-notes=\"Contar o caso real com calma — é o gatilho que originou o projeto inteiro.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div class=\"kicker\" style=\"margin-bottom:20px;\">O ponto de partida<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1500px;margin:0 0 var(--gap-title);\">Uma passagem esquecida quase parou um show<\u002Fh2>\n  <div style=\"font-size:var(--type-body);max-width:1300px;font-weight:600;margin-bottom:48px;\">Não é um cenário hipotético — já aconteceu. Um integrante da equipe ficou sem passagem porque ninguém tinha certeza de quem era responsável por comprá-la.<\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:0 0 40px;\">\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);flex:1;\">\n    <div style=\"padding-right:48px;border-right:2px solid var(--color-divider);\">\n      <div class=\"num\" style=\"font-size:52px;color:var(--tw-accent);\">ANTES<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);font-weight:600;margin-top:16px;\">Data do show marcada, ninguém dono da tarefa<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 48px;border-right:2px solid var(--color-divider);\">\n      <div class=\"num\" style=\"font-size:52px;color:var(--tw-accent);\">↓<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);font-weight:600;margin-top:16px;\">Passagem passa batido até faltar poucos dias<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 48px;border-right:2px solid var(--color-divider);\">\n      <div class=\"num\" style=\"font-size:52px;color:var(--tw-accent);\">↓<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);font-weight:600;margin-top:16px;\">Compra em cima da hora, preço muito mais alto<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-left:48px;\">\n      <div class=\"num\" style=\"font-size:52px;color:var(--tw-accent);\">DEPOIS<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);font-weight:600;margin-top:16px;\">Show quase comprometido por um detalhe de logística<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"O que já está no ar\" data-speaker-notes=\"Reforçar: isso não é mockup, é o sistema que ele testou.\" class=\"slide\" style=\"display:grid;grid-template-columns:1.3fr 1fr;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);gap:64px;\">\n  <div style=\"display:flex;flex-direction:column;min-height:0;min-width:0;\">\n    <div class=\"kicker\" style=\"margin-bottom:20px;\">Já validado<\u002Fdiv>\n    <h2 style=\"font-size:48px;margin:0 0 14px;\"><\u002Fh2>\n    <div style=\"font-size:24px;font-weight:600;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:28px;\">Sistema real, funcionando agora. Não é mockup.<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:2px;background:var(--color-divider);flex:1;min-height:0;\">\n      <div style=\"background:var(--color-bg);padding:18px 28px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;\">\n        <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);margin-bottom:6px;\">Cadastro de show<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:0.75;\">Data, local e elenco em um único lugar<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-bg);padding:18px 28px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;\">\n        <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);margin-bottom:6px;\">Elenco<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:0.75;\">Cada integrante e sua função na turnê<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-bg);padding:18px 28px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;\">\n        <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);margin-bottom:6px;\">Link sem login<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:0.75;\">Envio de documento sem precisar criar conta<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-bg);padding:18px 28px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;\">\n        <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);margin-bottom:6px;\">Painel de pendências<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:0.75;\">Quem falta enviar o quê, visível de cara<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--color-bg);padding:18px 28px;grid-column:span 2;border-top:2px solid var(--color-divider);display:flex;flex-direction:column;justify-content:center;overflow:hidden;\">\n        <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);margin-bottom:6px;color:var(--tw-accent);\">Ficha de Produção automática<\u002Fdiv>\n        <div style=\"font-size:20px;opacity:0.75;\">Gerada sozinha a partir do que já foi cadastrado<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;min-width:0;display:flex;align-items:center;justify-content:center;\">\n    <div style=\"width:min(100%,360px);aspect-ratio:9/19.5;border-radius:38px;border:10px solid var(--color-text);background:var(--color-text);box-shadow:0 24px 60px color-mix(in srgb, var(--color-text) 30%, transparent);position:relative;overflow:hidden;\">\n      <div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:46%;height:22px;background:var(--color-text);border-radius:0 0 14px 14px;z-index:2;\"><\u002Fdiv>\n      <image-slot id=\"proto-screenshot\" shape=\"rect\" fit=\"cover\" placeholder=\"Print do app — Agenda de shows\" style=\"width:100%;height:100%;background:var(--color-surface);\" src=\"1095397a-2a8f-4b6b-a68e-233088da2d8c\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A visão completa\" data-speaker-notes=\"O que ele testou é só a primeira peça — mostrar os oito módulos de uma vez.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div class=\"kicker\" style=\"margin-bottom:20px;\">A visão<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 16px;\">Oito módulos formam um único hub<\u002Fh2>\n  <div style=\"font-size:var(--type-small);font-weight:600;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:44px;\">O que você testou é o primeiro dos oito.<\u002Fdiv>\n\n  <sc-if value=\"{{ gridView }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);flex:1;gap:2px;background:var(--color-divider);\">\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-accent\" style=\"width:fit-content;margin-bottom:16px;\">No ar<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Controle de Tour + Rider Técnico<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Contratos &amp; Assinatura<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Logística Inteligente + Fornecedores<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">CRM &amp; Marketing de Audiência<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Importação de Venda de Ingressos<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Checkout Próprio<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Agente Conversacional<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;\">\n      <span class=\"tag tag-neutral\" style=\"width:fit-content;margin-bottom:16px;\">Próximo<\u002Fspan>\n      <div style=\"font-size:24px;font-weight:800;font-family:var(--font-heading);line-height:1.15;\">Financeiro<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ timelineView }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:0;flex:1;justify-content:center;\">\n    <sc-for list=\"{{ visionModules }}\" as=\"mod\" hint-placeholder-count=\"8\">\n      <div style=\"display:flex;align-items:center;gap:28px;padding:14px 0;border-bottom:2px solid var(--color-divider);\">\n        <div style=\"width:56px;font-size:24px;font-weight:800;font-family:var(--font-heading);color:var(--tw-accent);flex:none;\">{{ $index }}<\u002Fdiv>\n        <div style=\"width:520px;font-size:26px;font-weight:800;font-family:var(--font-heading);flex:none;\">{{ mod.name }}<\u002Fdiv>\n        <span class=\"{{ mod.tagClass }}\" style=\"width:140px;text-align:center;\">{{ mod.status }}<\u002Fspan>\n        <div style=\"flex:1;height:10px;background:var(--color-divider);position:relative;\"><div style=\"position:absolute;left:0;top:0;height:100%;background:var(--tw-accent-300);width:{{ mod.width }};\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<section data-label=\"Módulo 1 — Controle de Tour\" data-speaker-notes=\"Já no ar. A novidade é o rider técnico digital.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 01 DE 08<\u002Fdiv><span class=\"tag tag-accent\">No ar<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">O rider técnico digital acaba com a surpresa no dia do show<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:56px;min-height:0;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:32px;min-width:0;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\" style=\"font-size:24px;\">Elenco, documento de viagem e pendência por show já estão no ar. A novidade é o rider técnico: o que a casa de show precisa entregar, formalizado antes do dia do evento.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\" style=\"font-size:24px;\">A casa de show confirma item por item o que vai entregar — equipamento, palco, camarim — direto no Hub, antes do show. Sem ligação de última hora, sem \"achava que vocês traziam isso\".<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"border-top:2px solid var(--color-divider);padding-top:24px;\">\n        <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n        <div class=\"mod-p\" style=\"font-size:24px;\">Ainda não entra aqui — este módulo é sobre visibilidade e confirmação. A leitura automática de documentos chega no próximo módulo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1.5;display:flex;align-items:center;justify-content:center;min-width:0;\">\n      <div style=\"width:100%;max-width:640px;\">\n        <div style=\"border-radius:14px;background:var(--color-text);padding:12px;box-shadow:0 24px 60px color-mix(in srgb, var(--color-text) 30%, transparent);\">\n          <image-slot id=\"rider-screenshot\" shape=\"rect\" fit=\"cover\" placeholder=\"Print do relatório de rider técnico\" style=\"width:100%;aspect-ratio:16/9;background:var(--color-surface);border-radius:2px;\" src=\"ff71cef5-7394-4f6a-8bd8-1b42beb35675\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"height:16px;background:linear-gradient(to bottom, var(--color-text), color-mix(in srgb, var(--color-text) 80%, black));border-radius:0 0 8px 8px;position:relative;box-shadow:0 8px 16px color-mix(in srgb, var(--color-text) 30%, transparent);\">\n          <div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:5px;background:color-mix(in srgb, var(--color-bg) 25%, transparent);border-radius:0 0 4px 4px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:112%;margin-left:-6%;height:6px;background:color-mix(in srgb, var(--color-text) 70%, black);border-radius:0 0 6px 6px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 2 — Contratos e Assinatura\" data-speaker-notes=\"Contrato gerado por conversa, IA lendo risco, assinatura digital.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 02 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">Contrato gerado, revisado e assinado sem sair do Hub<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">Contrato feito na mão, ida e volta de e-mail, e o risco de assinar um contrato de terceiro sem notar uma cláusula ruim.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">Você descreve o show numa conversa curta e o contrato já sai pronto. Quando o contrato vem de fora — de uma casa de show, por exemplo — a assinatura acontece direto no Hub, sem imprimir nada.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n      <div class=\"mod-p\">A IA lê o contrato que chega de terceiro e avisa o risco antes de você assinar.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 3 — Logística Inteligente\" data-speaker-notes=\"É onde o problema da capa se resolve de vez.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 03 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">A logística já chega pesquisada e comparada<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">É este módulo que resolve o problema da passagem esquecida: ninguém mais precisa lembrar de comprar nada na última hora.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">No momento em que um show é marcado, o sistema já pesquisa e compara passagem, hotel e fornecedor de equipamento na cidade — pronto pra você aprovar com um clique.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n      <div class=\"mod-p\">A busca e a comparação de preço entre passagem, hotel e fornecedor são feitas pela IA — nada de abrir dez abas.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 4 — CRM e Marketing\" data-speaker-notes=\"Reativar público sem parecer spam.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 04 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">Quem já comprou ingresso volta a ser convidado<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">Público que já comprou ingresso uma vez e nunca mais recebeu contato — venda futura perdida na mesma cidade.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">O Hub reconhece quem já comprou ingresso antes, por cidade, e avisa quando a banda volta — sem virar mensagem genérica de spam.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n      <div class=\"mod-p\">A segmentação por cidade e o momento certo de reativar cada contato são calculados pela IA.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 5 — Importação de Ingressos\" data-speaker-notes=\"Fim do relatório manual.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 05 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">Os ingressos que você já vende entram sozinhos no Hub<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">Depender de relatório manual das plataformas de ingresso pra saber quanto vendeu e pra quem.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">Os dados de venda das plataformas que você já usa — Ticket Master, Ticket Agora — entram automaticamente no Hub, sem exportar planilha.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"display:flex;gap:12px;margin-bottom:24px;\"><span class=\"tag tag-neutral\">Ticket Master<\u002Fspan><span class=\"tag tag-neutral\">Ticket Agora<\u002Fspan><\u002Fdiv>\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n      <div class=\"mod-p\">A IA organiza os dados importados junto com os dados de produção da turnê, sem trabalho manual.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 6 — Checkout Próprio\" data-speaker-notes=\"Este é o que sustenta o modelo de parceria.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 06 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">O checkout próprio reduz a taxa de cada ingresso<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">As plataformas de hoje cobram taxa alta em cada ingresso — o número exato está no panorama de mercado, mais adiante.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">O Hub passa a vender o ingresso direto: menos taxa pra você e pro público, e a venda já conversa com produção, elenco e financeiro no mesmo lugar.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">É a base do modelo de parceria<\u002Fdiv>\n      <div class=\"mod-p\">A partir daqui, a parceria com Thiago passa a ser remunerada por percentual — sem mensalidade fixa. Detalhes no slide de proposta.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 7 — Agente Conversacional\" data-speaker-notes=\"O mais visual e marcante — o WhatsApp.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 07 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">O envio de um áudio fecha um show inteiro<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">Abrir um sistema pra registrar um show que você acabou de fechar por telefone — mais um passo entre o acordo e a produção começar.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">Você manda um áudio dizendo que fechou um show novo. O sistema já processa: data, elenco sugerido, obrigação de cada pessoa, prazo e lembrete automático.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"background:var(--color-surface);padding:32px;max-width:560px;\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px;\">\n          <div style=\"width:44px;height:44px;background:var(--tw-accent);flex:none;display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"><\u002Fpath><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"><\u002Fpath><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"><\u002Fline><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:600;\">\"Fechei show dia 14 em Goiânia\"<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mod-h3\" style=\"color:var(--tw-accent);margin-bottom:8px;\">Onde a IA entra<\u002Fdiv>\n        <div style=\"font-size:24px;opacity:0.8;\">O agente é a própria IA — ele entende o áudio e organiza tudo sozinho.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Módulo 8 — Financeiro\" data-speaker-notes=\"Fecha a lista de módulos.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:16px;\"><div class=\"mod-label\">MÓDULO 08 DE 08<\u002Fdiv><span class=\"tag tag-neutral\">Próximo<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">O financeiro avisa antes do problema aparecer<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:64px;\">\n    <div style=\"flex:1.3;display:flex;flex-direction:column;gap:40px;\">\n      <div><div class=\"mod-h3\">O que resolve<\u002Fdiv><div class=\"mod-p\">Falta de visão clara de contas a pagar, a receber e fluxo de caixa da turnê como um todo.<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div><div class=\"mod-h3\">Como funciona<\u002Fdiv><div class=\"mod-p\">Contas a pagar e a receber organizadas automaticamente por show, com o fluxo de caixa da turnê sempre visível.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-left:2px solid var(--color-divider);padding-left:48px;display:flex;flex-direction:column;justify-content:center;\">\n      <div class=\"mod-h3\" style=\"color:var(--tw-accent);\">Onde a IA entra<\u002Fdiv>\n      <div class=\"mod-p\">O sistema avisa sozinho quando algo foge do padrão — por exemplo, custo de hospedagem numa praça bem acima da média.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Roadmap\" data-speaker-notes=\"Estimativas direcionais, nunca cronograma fechado.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div class=\"kicker\" style=\"margin-bottom:20px;\">Para onde vamos<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);margin:0 0 12px;\">Nove fases, uma direção clara<\u002Fh2>\n  <div style=\"font-size:26px;font-weight:600;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin-bottom:48px;\">Estimativas direcionais — sujeitas ao ritmo real de dedicação, não um cronograma fechado.<\u002Fdiv>\n  <div style=\"display: flex; flex-direction: column; gap: 20px; flex: 1; justify-content: center; position: relative\">\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 0 — Protótipo<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><div style=\"position:absolute;left:0;top:0;height:100%;width:100%;background:var(--color-text);\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">Concluída<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 1 — MVP V1<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><div style=\"position:absolute;left:0;top:0;height:100%;width:67%;background:var(--tw-accent);\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">+ 1 semana<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 2 — Contratos<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">1-2 semanas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 3 — Logística<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">2-3&nbsp; semanas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 4 — CRM e MKT<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">2-3 semanas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 5 — Importação de Mailing/leads<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">3-5 dias<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 6 — Checkout<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">2-3 semanas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 7 — Agente<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">2-3 semanas<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <div style=\"width:280px;font-size:24px;font-weight:800;font-family:var(--font-heading);flex:none;\">FASE 8 — Financeiro<\u002Fdiv>\n      <div style=\"flex:1;height:28px;background:var(--color-divider);position:relative;\"><\u002Fdiv>\n      <div style=\"width:180px;font-size:22px;font-weight:700;text-align:right;flex:none;\">2-3 semanas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Panorama de mercado\" data-speaker-notes=\"Não é agressivo com concorrente — mostra espaço real.\" class=\"slide\" style=\"display:flex;flex-direction:column;padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div class=\"kicker\" style=\"margin-bottom:20px;\">Panorama de mercado<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);max-width:1600px;margin:0 0 var(--gap-title);\">O mercado brasileiro ainda não tem uma ferramenta assim<\u002Fh2>\n  <div style=\"display:flex;gap:56px;margin-bottom:48px;\">\n    <div style=\"flex:1;border-top:2px solid var(--color-divider);padding-top:24px;\">\n      <div class=\"mod-h3\">Fora do Brasil<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.8;\">Já existe mercado maduro de gestão de turnê — a mais conhecida, Master Tour, custa a partir de US$ 60/mês. Nenhuma delas vende ingresso, e nenhuma fala português.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-top:2px solid var(--color-divider);padding-top:24px;\">\n      <div class=\"mod-h3\">No Brasil<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.8;\">Não existe ferramenta feita pra turnê musical. A opção mais próxima atende evento em geral — casamento, buffet — não a rotina de uma banda em turnê.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border-top:2px solid var(--color-divider);padding-top:24px;\">\n      <div class=\"mod-h3\">O que ninguém junta<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.8;\">Turnê, chekout de ingresso mais barato, contrato com IA, financeiro, log[istica automatizada e Agentes de IA no mesmo lugar. É por isso que \"Hub\" está no nome.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;gap:56px;\">\n    <div style=\"flex:1.2;display:flex;flex-direction:column;\">\n      <div style=\"font-size:26px;font-weight:600;margin-bottom:28px;\">Taxa cobrada hoje em cada ingresso vendido*<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:48px;flex:1;min-height:0;padding-bottom:8px;border-bottom:2px solid var(--color-divider);\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n          <div style=\"font-size:30px;font-weight:800;font-family:var(--font-heading);\">17%<\u002Fdiv>\n          <div style=\"width:120px;height:170px;background:var(--color-neutral-400);\"><\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:600;\">Ingresse<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n          <div style=\"font-size:30px;font-weight:800;font-family:var(--font-heading);\">até 12,5%<\u002Fdiv>\n          <div style=\"width:120px;height:125px;background:var(--color-neutral-400);\"><\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:600;\">Sympla<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n          <div style=\"font-size:30px;font-weight:800;font-family:var(--font-heading);color:var(--tw-accent);\">a definir<\u002Fdiv>\n          <div style=\"width:120px;height:70px;border:3px dashed var(--tw-accent);\"><\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;color:var(--tw-accent);\">Checkout Hub<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:22px;opacity:0.6;margin-top:16px;\">A taxa do checkout próprio ainda será definida — a meta é ficar bem abaixo do que se cobra hoje.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;min-width:0;\">\n      <div style=\"width:100%;max-width:460px;\">\n        <div style=\"border-radius:12px;background:var(--color-text);padding:10px;box-shadow:0 20px 48px color-mix(in srgb, var(--color-text) 30%, transparent);\">\n          <image-slot id=\"dashboard-screenshot\" shape=\"rect\" fit=\"cover\" placeholder=\"Print do dashboard — Agenda de produção\" style=\"width:100%;aspect-ratio:16/8.5;background:var(--color-surface);border-radius:2px;\" src=\"40e6a717-8b83-4633-a4b5-060eae0b80c9\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"height:14px;background:linear-gradient(to bottom, var(--color-text), color-mix(in srgb, var(--color-text) 80%, black));border-radius:0 0 7px 7px;position:relative;box-shadow:0 6px 14px color-mix(in srgb, var(--color-text) 30%, transparent);\">\n          <div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:70px;height:4px;background:color-mix(in srgb, var(--color-bg) 25%, transparent);border-radius:0 0 3px 3px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:112%;margin-left:-6%;height:5px;background:color-mix(in srgb, var(--color-text) 70%, black);border-radius:0 0 5px 5px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A proposta de parceria\" data-speaker-notes=\"Slide mais importante. Falar com calma: sociedade, não venda.\" class=\"slide\" style=\"display:flex;flex-direction:column;background:var(--tw-accent);color:var(--color-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"font-size:var(--type-label);font-weight:800;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:20px;\">A proposta<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);color:var(--color-bg);max-width:1500px;margin:0 0 var(--gap-title);\">Isto pode ser uma \"sociedade\" entre parceiros<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:color-mix(in srgb, var(--color-bg) 30%, transparent);flex:1;\">\n    <div style=\"background:var(--tw-accent);padding:36px 40px 36px 0;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-size:28px;font-weight:800;font-family:var(--font-heading);margin-bottom:14px;\">Não é venda de sistema<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.92;\">Não existe mensalidade nem taxa de uso cobrada de você.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tw-accent);padding:36px 0 36px 40px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-size:28px;font-weight:800;font-family:var(--font-heading);margin-bottom:14px;\">Percentual sobre o ingresso<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.92;\">A partir do checkout próprio (Fase 6), Thiago recebe um percentual sobre cada ingresso vendido nas suas turnês.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tw-accent);padding:36px 40px 0 0;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-size:28px;font-weight:800;font-family:var(--font-heading);margin-bottom:14px;\">Sem bilheteria, também funciona<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.92;\">Em shows fechados (contrato com prefeitura, evento sem ingresso), um pequeno percentual pode ser negociado sobre o valor do contrato.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tw-accent);padding:36px 0 0 40px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"font-size:28px;font-weight:800;font-family:var(--font-heading);margin-bottom:14px;\">Você também ganha com a monetização<\u002Fdiv>\n      <div style=\"font-size:26px;opacity:0.92;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Convite\" data-speaker-notes=\"Fechar com clareza: o que se espera agora e o que vem depois.\" class=\"slide\" style=\"display:flex;flex-direction:column;background:var(--color-text);color:var(--color-bg);padding:var(--pad-top) var(--pad-x) var(--pad-bottom) var(--pad-x);\">\n  <div style=\"font-size:var(--type-label);font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--tw-accent-400);margin-bottom:20px;\">Próximo passo<\u002Fdiv>\n  <h2 style=\"font-size:var(--type-title);color:var(--color-bg);max-width:1500px;margin:0 0 56px;\">O que vem agora<\u002Fh2>\n  <div style=\"display:flex;flex:1;gap:0;\">\n    <div style=\"flex:1;padding-right:56px;border-right:2px solid color-mix(in srgb, var(--color-bg) 25%, transparent);\">\n      <div class=\"tag tag-accent\" style=\"width:fit-content;margin-bottom:24px;\">Agora<\u002Fdiv>\n      <div style=\"font-size:36px;font-weight:800;font-family:var(--font-heading);margin-bottom:20px;\">Testar o MVP na logística real<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);opacity:0.85;\">Usar a v1 na rotina real da turnê e nos contar o que funcionou, o que não funcionou, relatar novos problemas a resolver na logística das tournês, trabalhar em conjunto ideias de novos recursos.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;padding-left:56px;\">\n      <div class=\"tag tag-outline\" style=\"width:fit-content;margin-bottom:24px;border-color:var(--color-bg);color:var(--color-bg);\">Se a parceria avançar<\u002Fdiv>\n      <div style=\"font-size:36px;font-weight:800;font-family:var(--font-heading);margin-bottom:20px;\">Seguimos juntos pelas próximas fases<\u002Fdiv>\n      <div style=\"font-size:var(--type-small);opacity:0.85;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;mood&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;editorial&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;editorial&quot;, &quot;sober&quot;], &quot;section&quot;: &quot;Tom visual&quot;},\n  &quot;pace&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;detailed&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;detailed&quot;, &quot;executive&quot;], &quot;section&quot;: &quot;Ritmo do conteúdo&quot;},\n  &quot;visionLayout&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;grid&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;grid&quot;, &quot;timeline&quot;], &quot;section&quot;: &quot;Slide da visão&quot;}\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const mood = this.props.mood ?? 'editorial';\n    const sober = mood === 'sober';\n    const pace = this.props.pace ?? 'detailed';\n    const detailed = pace !== 'executive';\n    const visionLayout = this.props.visionLayout ?? 'grid';\n    const modulesData = [\n      { name: 'Controle de Tour + Rider Técnico', status: 'No ar', tagClass: 'tag tag-accent', width: '10%' },\n      { name: 'Contratos & Assinatura', status: 'Próximo', tagClass: 'tag tag-neutral', width: '25%' },\n      { name: 'Logística Inteligente', status: 'Próximo', tagClass: 'tag tag-neutral', width: '40%' },\n      { name: 'CRM & Marketing', status: 'Próximo', tagClass: 'tag tag-neutral', width: '52%' },\n      { name: 'Importação de Ingressos', status: 'Próximo', tagClass: 'tag tag-neutral', width: '62%' },\n      { name: 'Checkout Próprio', status: 'Próximo', tagClass: 'tag tag-neutral', width: '78%' },\n      { name: 'Agente Conversacional', status: 'Próximo', tagClass: 'tag tag-neutral', width: '90%' },\n      { name: 'Financeiro', status: 'Próximo', tagClass: 'tag tag-neutral', width: '100%' }\n    ];\n    return {\n      accentVar: sober ? '#3a3a3a' : '#ec3013',\n      accent300Var: sober ? '#c9c9c9' : '#ffc4b8',\n      accent400Var: sober ? '#8a8a8a' : '#ff9783',\n      detailed,\n      gridView: visionLayout !== 'timeline',\n      timelineView: visionLayout === 'timeline',\n      visionModules: modulesData\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
